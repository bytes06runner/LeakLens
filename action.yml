name: LeakLens scan
description: Static scan of Python scripts and Jupyter notebooks for data leakage, with SARIF for GitHub code scanning. The analysed code is never executed.
branding:
  icon: search
  color: blue
inputs:
  paths:
    description: Files or directories to scan (space separated)
    default: "."
  fail-on:
    description: "Severity that fails the job: never, low, medium or high"
    default: high
  min-confidence:
    description: "Lowest confidence that counts: low, medium or high"
    default: medium
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning (needs the security-events write permission)
    default: "true"
outputs:
  sarif:
    description: Path of the SARIF report
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install LeakLens
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Scan
      id: scan
      shell: bash
      run: |
        out="${RUNNER_TEMP}/leaklens.sarif"
        echo "sarif=${out}" >> "$GITHUB_OUTPUT"
        set +e
        leaklens scan ${{ inputs.paths }} --format sarif --output "${out}" --fail-on "${{ inputs.fail-on }}" --min-confidence "${{ inputs.min-confidence }}" > /dev/null
        code=$?
        leaklens scan ${{ inputs.paths }} --fail-on never --min-confidence "${{ inputs.min-confidence }}"
        echo "exit=${code}" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: leaklens
    - name: Fail on findings
      shell: bash
      run: exit ${{ steps.scan.outputs.exit }}
