# Base pipelines of the injected benchmark. `family` drives which operators apply; `shape` is holdout or cv.
# metric: the line the pipeline prints ("name: value"); higher_is_better signs the inflation.
# hparam/values: the setting a multi-test operator tunes; scoring: sklearn scorer used by the canonical fix.
tab_credit: {family: tabular, shape: holdout, task: clf, metric: test_auc, higher_is_better: true, cat_col: region, target: default, scoring: roc_auc, hparam: logisticregression__C, values: [0.01, 0.1, 1, 10]}
tab_housing: {family: tabular, shape: cv, task: reg, metric: cv_r2, higher_is_better: true, target: price, scoring: r2, hparam: randomforestregressor__max_depth, values: [3, 6, 12, null]}
tab_fraud: {family: tabular, shape: holdout, task: clf, metric: test_ap, higher_is_better: true, imbalanced: true, target: is_fraud, scoring: average_precision, hparam: max_depth, values: [1, 2, 3, 5]}
tab_churn: {family: tabular, shape: cv, task: clf, metric: cv_auc, higher_is_better: true, cat_col: plan, target: churned, scoring: roc_auc, hparam: selectkbest__k, values: [5, 10, 20, 40]}
ts_sales: {family: timeseries, shape: holdout, task: reg, metric: test_mae, higher_is_better: false, time_col: date, value_col: sales, target: target, scoring: neg_mean_absolute_error, hparam: max_depth, values: [2, 3, 5]}
ts_sensor: {family: timeseries, shape: cv, task: reg, metric: cv_mae, higher_is_better: false, time_col: timestamp, value_col: temp, series_col: device, target: target, scoring: neg_mean_absolute_error, hparam: min_samples_leaf, values: [1, 5, 20]}
ts_energy: {family: timeseries, shape: holdout, task: reg, metric: test_r2, higher_is_better: true, time_col: datetime, value_col: load_kw, target: target, scoring: r2, hparam: min_samples_leaf, values: [1, 5, 20]}
ts_air: {family: timeseries, shape: cv, task: clf, metric: cv_auc, higher_is_better: true, time_col: day, value_col: pm25, target: high_tomorrow, scoring: roc_auc, hparam: logisticregression__C, values: [0.01, 0.1, 1, 10]}
grp_eeg: {family: grouped, shape: cv, task: clf, metric: cv_auc, higher_is_better: true, entity: subject, entity_source: file_path, target: event, scoring: roc_auc, hparam: min_samples_leaf, values: [1, 3, 10]}
grp_patients: {family: grouped, shape: holdout, task: clf, metric: test_auc, higher_is_better: true, entity: patient_id, target: complication, scoring: roc_auc, hparam: min_samples_leaf, values: [1, 2, 5, 10]}
grp_users: {family: grouped, shape: cv, task: clf, metric: cv_auc, higher_is_better: true, entity: user_id, cat_col: device, target: purchased, scoring: roc_auc, hparam: histgradientboostingclassifier__learning_rate, values: [0.03, 0.1, 0.3]}
grp_sites: {family: grouped, shape: holdout, task: clf, metric: test_auc, higher_is_better: true, entity: site, target: diagnosis, scoring: roc_auc, hparam: min_samples_leaf, values: [1, 5, 20]}
